[package]
name = "butterlog"
version = "0.3.34"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "butterlog_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["msfs"]
# MSFS support through SimConnect. Windows only: SimConnect is a Windows SDK (its static
# library is linked from `C:\MSFS 2024 SDK`, see simplesimconnect-sys/build.rs). On macOS and
# Linux the feature does nothing, so a plain `cargo build` works everywhere. Build with
# `--no-default-features` on Windows to leave it out when the SDK isn't installed.
# build.rs turns "this feature on a Windows target" into `cfg(msfs)`, which the code checks.
msfs = ["dep:simplesimconnect", "dep:simplesimconnect-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
rstar = "0.11"
butterlog-wire = { path = "../../butterlog-service/wire" }
butterlog-identity = { path = "../../butterlog-service/identity" }
chrono = "0.4"
anyhow = "1.0"
directories = "6.0.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
notify = "8.2.0"
regex = "1.12.3"
chrono-tz = "0.10.4"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
webp = "0.3.1"
parking_lot = "0.12"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
simplesimconnect = { path = "../../simplesimconnect", optional = true }
simplesimconnect-sys = { path = "../../simplesimconnect-sys", optional = true }
